[pytest]
addopts :
    --headed
    # 关闭视频录制
    --video=on
    # 开启截图功能
    --screenshot=on
    # 设置基础URL
    --base-url=http://test.tkfzjt.com/basic-front/login
    --har=off
    # 设置失败重试次数
    --reruns=0
    --persistent=off
    --ui_timeout=50_000
    --monitor=off
    --send_feishu_report=on
    --report_mark=汇总
    --tempdir=
    --use_feishu=on
    --feishu=oc_b2350e0a81b15becb99e59e62c772e1f
    --wsendpoint=
    --admin_password=off
    --api_port=
    --total_requests=1
    --rerun_add_timeout=20_000
    --test-suffix=
    --alluredir=./allure-results
    --jobUrl=127.0.0.1
    -vqs
    # WebSocket端点配置
    #--wsendpoint=ws://192.168.31.44:34609/2d0e2a043e5f791f5dcca80ce6b0b9c9,2;local,1


testpaths = src/test_cases
python_files = test_*.py



